<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0B1330" />
      <stop offset="55%" stop-color="#080F24" />
      <stop offset="100%" stop-color="#050C1A" />
    </radialGradient>

    <radialGradient id="fishBody" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFE38A" />
      <stop offset="55%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E0AE00" />
    </radialGradient>

    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>

    <filter id="sparkleGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>

    <g id="goldfish">
      <ellipse cx="0" cy="0" rx="30" ry="22" fill="#FFD700" opacity="0.16" filter="url(#softGlow)" />
      <path d="M -14 0 C -27 -15, -36 -7, -31 0 C -36 7, -27 15, -14 0 Z" fill="#DDA0DD" opacity="0.55" />
      <path d="M -12 -2 C -21 -11, -25 -4, -21 -2 C -25 3, -21 9, -12 2 Z" fill="#DDA0DD" opacity="0.4" />
      <ellipse cx="2" cy="0" rx="13" ry="8" fill="url(#fishBody)" />
      <path d="M 0 -7 C 3 -13, 8 -13, 8.5 -7 Z" fill="#DDA0DD" opacity="0.5" />
      <path d="M 0 7 C 3 12, 7 12, 7.5 7 Z" fill="#DDA0DD" opacity="0.4" />
      <circle cx="9.5" cy="-1.5" r="1" fill="#3A2A00" opacity="0.55" />
    </g>

    <g id="sparkleGold">
      <circle r="6.5" fill="#FFD700" opacity="0.22" filter="url(#sparkleGlow)" />
      <circle r="1.3" fill="#FFF3C4" opacity="0.9" />
    </g>

    <g id="sparkleCyan">
      <circle r="6.5" fill="#7DE8E8" opacity="0.2" filter="url(#sparkleGlow)" />
      <circle r="1.3" fill="#CFFAFA" opacity="0.85" />
    </g>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad)" />

  <use href="#goldfish" transform="translate(150,130) rotate(15) scale(1.1)" />
  <use href="#goldfish" transform="translate(430,300) rotate(-25) scale(0.9)" />
  <use href="#goldfish" transform="translate(260,470) rotate(160) scale(1.0)" />

  <use href="#sparkleGold" transform="translate(70,60)" />
  <use href="#sparkleCyan" transform="translate(320,40)" />
  <use href="#sparkleGold" transform="translate(520,90)" />
  <use href="#sparkleCyan" transform="translate(180,190)" />
  <use href="#sparkleGold" transform="translate(400,150)" />
  <use href="#sparkleCyan" transform="translate(60,320)" />
  <use href="#sparkleGold" transform="translate(240,300)" />
  <use href="#sparkleCyan" transform="translate(500,260)" />
  <use href="#sparkleGold" transform="translate(340,380)" />
  <use href="#sparkleCyan" transform="translate(90,430)" />
  <use href="#sparkleGold" transform="translate(220,520)" />
  <use href="#sparkleCyan" transform="translate(460,470)" />
  <use href="#sparkleGold" transform="translate(560,390)" />
  <use href="#sparkleCyan" transform="translate(140,560)" />
  <use href="#sparkleGold" transform="translate(380,540)" />
  <use href="#sparkleCyan" transform="translate(30,180)" />
</svg>
